name: news_hub
description: "News Hub: browse top headlines, search articles and read offline. Built on NewsAPI.org."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0

  # --- Routing ---
  go_router: ^18.1.1

  # --- Networking ---
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  dio_cache_interceptor: ^4.0.7   # in-memory HTTP cache only; offline persistence is Hive's job
  connectivity_plus: ^7.3.2

  # --- Local storage (Hive CE, D1) ---
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

  # --- DI & logging ---
  get_it: ^9.3.0
  logger: ^2.8.0

  # --- UI ---
  cached_network_image: ^4.0.5
  cupertino_icons: ^1.0.8
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Lints (extended in analysis_options.yaml) ---
  flutter_lints: ^6.0.0

  # --- Code generation (outputs committed, D6) ---
  build_runner: ^2.15.1
  retrofit_generator: ^10.3.2
  json_serializable: ^6.15.2
  hive_ce_generator: ^1.11.2

  # --- Testing ---
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true